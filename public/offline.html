<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2945c7" />
    <title>Sin conexión · App-Llito</title>
    <style>
      :root { color-scheme: light dark; --bg: #f3f5f9; --ink: #141a2b; --muted: #4c5568; --accent: #2945c7; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1320; --ink: #eef1f7; --muted: #a9b2c4; --accent: #8fa4ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink);
        font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { display: grid; gap: 1rem; justify-items: center; max-width: 22rem; }
      img { width: 72px; height: 72px; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; color: var(--muted); }
      button { min-height: 48px; padding: 0.7rem 1.5rem; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img src="/iconos/icono-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hay internet ahora mismo. En cuanto vuelva, la app se pondrá al día.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
